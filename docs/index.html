<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>react-text-underline — Live Demo</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.21.4/babel.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f12;
      --surface: #18181d;
      --surface2: #22222a;
      --border: #2e2e38;
      --text: #e8e8f0;
      --muted: #8888a0;
      --accent: #7c6af7;
      --accent2: #06b6d4;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    /* ── Header ── */
    header {
      border-bottom: 1px solid var(--border);
      padding: 20px 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      backdrop-filter: blur(12px);
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(15, 15, 18, 0.88);
    }
    header .logo {
      display: flex; align-items: center; gap: 10px;
      font-weight: 700; font-size: 1.05rem;
    }
    header .logo .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    header nav { display: flex; gap: 12px; flex-wrap: wrap; }
    header nav a {
      color: var(--muted);
      text-decoration: none;
      font-size: 0.85rem;
      font-weight: 500;
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid var(--border);
      transition: all 0.2s;
    }
    header nav a:hover { color: var(--text); border-color: var(--accent); }
    header nav a.primary {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }
    header nav a.primary:hover { opacity: 0.85; }

    /* ── Hero ── */
    .hero {
      max-width: 860px;
      margin: 80px auto 0;
      padding: 0 32px;
      text-align: center;
    }
    .badge {
      display: inline-block;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 14px;
      color: var(--accent2);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }
    .hero h1 { font-size: clamp(2rem, 5vw, 3.4rem); font-weight: 800; line-height: 1.15; margin-bottom: 16px; }
    .hero p { font-size: 1.05rem; color: var(--muted); max-width: 540px; margin: 0 auto 32px; }
    .install-block {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 20px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.88rem;
      color: var(--accent2);
      margin-bottom: 64px;
    }
    .install-block span { color: var(--muted); }

    /* ── Sections ── */
    section {
      max-width: 980px;
      margin: 0 auto 80px;
      padding: 0 32px;
    }
    section h2 {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
    }
    .section-sub {
      color: var(--muted);
      font-size: 0.9rem;
      margin-bottom: 28px;
    }

    /* ── Demo cards grid ── */
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px 24px 20px;
      transition: border-color 0.2s;
    }
    .card:hover { border-color: var(--accent); }
    .card-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      margin-bottom: 14px;
    }
    .card-preview {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 18px;
    }
    .card-code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.72rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 14px;
      color: var(--muted);
      white-space: pre;
      overflow-x: auto;
    }
    .card-code .kw  { color: #a78bfa; }
    .card-code .str { color: #6ee7b7; }
    .card-code .tag { color: #60a5fa; }

    /* ── Color palette ── */
    .color-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(90px, 1fr));
      gap: 12px;
      margin-bottom: 32px;
    }
    .color-swatch {
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      cursor: pointer;
    }
    .swatch-circle {
      width: 40px; height: 40px; border-radius: 50%;
      border: 2px solid transparent;
      transition: border-color 0.2s, transform 0.2s;
    }
    .color-swatch.active .swatch-circle,
    .color-swatch:hover .swatch-circle { border-color: var(--text); transform: scale(1.1); }
    .swatch-label { font-size: 0.7rem; color: var(--muted); font-weight: 500; }

    .color-preview-area {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 40px 32px;
      text-align: center;
      font-size: 2rem;
      font-weight: 800;
    }

    /* ── Usage section ── */
    .code-block {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 28px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 0.82rem;
      overflow-x: auto;
      line-height: 1.7;
    }
    .code-block .kw  { color: #a78bfa; }
    .code-block .str { color: #6ee7b7; }
    .code-block .tag { color: #60a5fa; }
    .code-block .cmt { color: #555577; }
    .code-block .attr { color: #fbbf24; }

    /* ── Footer ── */
    footer {
      border-top: 1px solid var(--border);
      text-align: center;
      padding: 32px;
      color: var(--muted);
      font-size: 0.82rem;
    }
    footer a { color: var(--accent2); text-decoration: none; }
    footer a:hover { text-decoration: underline; }

    /* ── Variant pills ── */
    .variant-pills { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 28px; }
    .pill {
      padding: 6px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 0.8rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    .pill.active, .pill:hover { border-color: var(--accent); color: var(--text); background: var(--surface2); }
    .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .playground-preview {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 48px 40px;
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      margin-bottom: 20px;
    }

    .divider { height: 1px; background: var(--border); margin: 80px auto; max-width: 980px; }
  </style>
</head>
<body>

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    /* ────────── Re-implementation of TextHighlight ────────── */
    const COLORS = {
      yellow:     { highlight: '#fde68a', text: null },
      cyan:       { highlight: '#a5f3fc', text: null },
      green:      { highlight: '#bbf7d0', text: null },
      pink:       { highlight: '#fbcfe8', text: null },
      orange:     { highlight: '#fed7aa', text: null },
      purple:     { highlight: '#ddd6fe', text: null },
      blue:       { highlight: '#bfdbfe', text: null },
      red:        { highlight: '#fecaca', text: null },
      neonCyan:   { highlight: '#06b6d4', text: '#fff' },
      neonPurple: { highlight: '#a855f7', text: '#fff' },
      neonGreen:  { highlight: '#22c55e', text: '#fff' },
    };

    const GRADIENTS = {
      yellow:     'linear-gradient(90deg, #fde68a, #fbbf24)',
      cyan:       'linear-gradient(90deg, #a5f3fc, #22d3ee)',
      green:      'linear-gradient(90deg, #bbf7d0, #4ade80)',
      pink:       'linear-gradient(90deg, #fbcfe8, #f472b6)',
      orange:     'linear-gradient(90deg, #fed7aa, #fb923c)',
      purple:     'linear-gradient(90deg, #ddd6fe, #a78bfa)',
      blue:       'linear-gradient(90deg, #bfdbfe, #60a5fa)',
      red:        'linear-gradient(90deg, #fecaca, #f87171)',
      neonCyan:   'linear-gradient(90deg, #06b6d4, #0ea5e9)',
      neonPurple: 'linear-gradient(90deg, #a855f7, #ec4899)',
      neonGreen:  'linear-gradient(90deg, #22c55e, #84cc16)',
    };

    function hexToRgba(hex, alpha) {
      const cleaned = String(hex ?? '').replace('#', '').trim();
      const expanded = cleaned.length === 3 ? cleaned.split('').map(c => c + c).join('') : cleaned;
      if (expanded.length !== 6) return `rgba(0,0,0,${alpha})`;
      const r = parseInt(expanded.slice(0, 2), 16);
      const g = parseInt(expanded.slice(2, 4), 16);
      const b = parseInt(expanded.slice(4, 6), 16);
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function TextHighlight({ children, variant = 'marker', color = 'yellow', animate = true, style = {} }) {
      const c = COLORS[color] ?? COLORS.yellow;

      const brushBgRef = React.useRef(null);
      const brushBaseTransform = 'translateY(-50%) rotate(-1deg) skewX(-8deg)';
      const setBrushVisible = (visible) => {
        if (!animate) return;
        const el = brushBgRef.current;
        if (!el) return;
        el.style.transform = `${brushBaseTransform} scaleX(${visible ? 1 : 0})`;
      };

      if (variant === 'marker') {
        return (
          <span
            style={{
              position: 'relative', padding: '0 4px',
              background: `linear-gradient(120deg, ${c.highlight} 0%, ${c.highlight} 100%)`,
              backgroundRepeat: 'no-repeat',
              backgroundSize: animate ? '0% 55%' : '100% 55%',
              backgroundPosition: '0 88%',
              transition: 'background-size 0.5s cubic-bezier(0.4,0,0.2,1)',
              color: c.text ?? 'inherit',
              ...style,
            }}
            onMouseEnter={e => animate && (e.currentTarget.style.backgroundSize = '100% 55%')}
            onMouseLeave={e => animate && (e.currentTarget.style.backgroundSize = '0% 55%')}
          >{children}</span>
        );
      }

      if (variant === 'brush') {
        const base = c.highlight;
        const baseHi = hexToRgba(base, 0.92);
        const baseMid = hexToRgba(base, 0.78);
        const baseLo = hexToRgba(base, 0.35);

        return (
          <span
            style={{ position: 'relative', display: 'inline-block', color: c.text ?? 'inherit', ...style }}
            onMouseEnter={() => setBrushVisible(true)}
            onMouseLeave={() => setBrushVisible(false)}
          >
            <span
              aria-hidden="true"
              ref={brushBgRef}
              style={{
                position: 'absolute',
                left: -2,
                right: -2,
                top: '60%',
                height: '1.05em',
                zIndex: 0,
                pointerEvents: 'none',
                transformOrigin: '0 50%',
                transform: `${brushBaseTransform} scaleX(${animate ? 0 : 1})`,
                transition: 'transform 0.45s cubic-bezier(0.4,0,0.2,1)',
                borderRadius: 999,
                backgroundImage: [
                  `linear-gradient(180deg, ${baseMid}, ${baseHi} 55%, ${baseMid})`,
                  `repeating-linear-gradient(-25deg, ${baseLo} 0 2px, ${hexToRgba(base, 0)} 2px 7px)`,
                ].join(', '),
                backgroundBlendMode: 'multiply',
                backgroundRepeat: 'no-repeat, no-repeat',
                backgroundSize: '100% 100%, 100% 100%',
                filter: `drop-shadow(0 1px 0 ${hexToRgba(base, 0.25)})`,
              }}
            />
            <span style={{ position: 'relative', zIndex: 1 }}>{children}</span>
          </span>
        );
      }

      if (variant === 'brushstroke') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', color: c.text ?? 'inherit', ...style }}>
            <svg aria-hidden="true" style={{ position: 'absolute', left: 0, right: 0, bottom: -6, width: '100%', overflow: 'visible', pointerEvents: 'none' }}
              viewBox="0 0 200 12" preserveAspectRatio="none" height="12">
              <path d="M2 9 C30 3, 70 11, 100 7 C130 3, 160 10, 198 6" fill="none" stroke={c.highlight}
                strokeWidth="7" strokeLinecap="round"
                ref={el => {
                  if (el && animate) {
                    el.style.strokeDasharray = 220;
                    el.style.strokeDashoffset = 220;
                    el.style.transition = 'stroke-dashoffset 0.7s cubic-bezier(0.4,0,0.2,1)';
                    requestAnimationFrame(() => { el.style.strokeDashoffset = 0; });
                  }
                }}
              />
            </svg>
            {children}
          </span>
        );
      }

      if (variant === 'slide') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', cursor: 'default', color: c.text ?? 'inherit', ...style }}>
            <span style={{ position: 'absolute', inset: 0, transformOrigin: 'left', background: c.highlight,
              transform: 'scaleX(0)', transition: 'transform 0.4s cubic-bezier(0.4,0,0.2,1)', zIndex: 0, borderRadius: 2 }}
              ref={el => {
                if (!el) return;
                const p = el.parentElement;
                if (!animate) { el.style.transform = 'scaleX(1)'; return; }
                p?.addEventListener('mouseenter', () => (el.style.transform = 'scaleX(1)'));
                p?.addEventListener('mouseleave', () => (el.style.transform = 'scaleX(0)'));
              }}
            />
            <span style={{ position: 'relative', zIndex: 10 }}>{children}</span>
          </span>
        );
      }

      if (variant === 'gradient') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', color: c.text ?? 'inherit', ...style }}>
            {children}
            <span style={{ position: 'absolute', bottom: 0, left: 0, height: 3, borderRadius: 9999,
              background: GRADIENTS[color] ?? GRADIENTS.yellow,
              width: animate ? '0%' : '100%', transition: 'width 0.5s cubic-bezier(0.4,0,0.2,1)' }}
              ref={el => {
                if (!el) return;
                const p = el.parentElement;
                if (!animate) return;
                p?.addEventListener('mouseenter', () => (el.style.width = '100%'));
                p?.addEventListener('mouseleave', () => (el.style.width = '0%'));
              }}
            />
          </span>
        );
      }

      if (variant === 'glow') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', fontWeight: 'bold',
            color: c.highlight,
            textShadow: `0 0 20px ${c.highlight}88, 0 0 40px ${c.highlight}44`,
            transition: 'text-shadow 0.3s ease', ...style }}
            onMouseEnter={e => (e.currentTarget.style.textShadow = `0 0 10px ${c.highlight}, 0 0 30px ${c.highlight}cc, 0 0 60px ${c.highlight}66`)}
            onMouseLeave={e => (e.currentTarget.style.textShadow = `0 0 20px ${c.highlight}88, 0 0 40px ${c.highlight}44`)}
          >{children}</span>
        );
      }

      if (variant === 'scratch') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', ...style }}>
            {children}
            <svg aria-hidden="true" style={{ position: 'absolute', left: 0, right: 0, bottom: -4, width: '100%', overflow: 'visible', pointerEvents: 'none' }}
              viewBox="0 0 200 8" preserveAspectRatio="none" height="8">
              <path d="M1 5 C10 2, 20 7, 35 4 C50 1, 60 6, 80 4 C100 2, 115 7, 135 5 C155 3, 170 7, 199 4"
                fill="none" stroke={c.highlight} strokeWidth="3" strokeLinecap="round" strokeLinejoin="round" />
              <path d="M2 7 C25 5, 50 8, 90 6 C120 4, 155 8, 198 6"
                fill="none" stroke={c.highlight} strokeWidth="1.5" strokeLinecap="round" opacity="0.5" />
            </svg>
          </span>
        );
      }

      if (variant === 'double') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', ...style }}>
            {children}
            <span style={{ position: 'absolute', left: 0, right: 0, bottom: -3, height: 1, borderRadius: 9999, background: c.highlight }} />
            <span style={{ position: 'absolute', left: 0, right: 0, bottom: -7, height: 3, borderRadius: 9999, background: c.highlight }} />
          </span>
        );
      }

      if (variant === 'wave') {
        return (
          <span style={{ position: 'relative', display: 'inline-block', paddingBottom: 8, ...style }}>
            {children}
            <svg aria-hidden="true" style={{ position: 'absolute', left: 0, right: 0, bottom: 0, width: '100%', overflow: 'visible', pointerEvents: 'none' }}
              viewBox="0 0 200 6" preserveAspectRatio="none" height="6">
              <path d="M0 3 Q10 0 20 3 Q30 6 40 3 Q50 0 60 3 Q70 6 80 3 Q90 0 100 3 Q110 6 120 3 Q130 0 140 3 Q150 6 160 3 Q170 0 180 3 Q190 6 200 3"
                fill="none" stroke={c.highlight} strokeWidth="2.5" strokeLinecap="round" />
            </svg>
          </span>
        );
      }

      if (variant === 'pill') {
        return (
          <span
            style={{ position: 'relative', display: 'inline-block', padding: '0 8px', color: c.text ?? 'inherit', ...style }}
            onMouseEnter={e => {
              if (!animate) return;
              const bg = e.currentTarget.querySelector('[data-pill-bg]');
              if (!bg) return;
              bg.style.opacity = '0.9';
              bg.style.transform = 'translateY(-50%) scaleX(1)';
            }}
            onMouseLeave={e => {
              if (!animate) return;
              const bg = e.currentTarget.querySelector('[data-pill-bg]');
              if (!bg) return;
              bg.style.opacity = '0';
              bg.style.transform = 'translateY(-50%) scaleX(0.2)';
            }}
          >
            <span
              data-pill-bg
              aria-hidden="true"
              style={{
                position: 'absolute',
                left: 0,
                right: 0,
                top: '54%',
                height: '1.05em',
                background: c.highlight,
                borderRadius: 999,
                opacity: animate ? 0 : 0.9,
                transform: `translateY(-50%) scaleX(${animate ? 0.2 : 1})`,
                transformOrigin: '50% 50%',
                transition: 'transform 0.35s cubic-bezier(0.4,0,0.2,1), opacity 0.25s ease',
                zIndex: 0,
              }}
            />
            <span style={{ position: 'relative', zIndex: 1 }}>{children}</span>
          </span>
        );
      }

      if (variant === 'dashed') {
        return (
          <span
            style={{ position: 'relative', display: 'inline-block', paddingBottom: 2, color: c.text ?? 'inherit', ...style }}
            onMouseEnter={e => {
              if (!animate) return;
              const line = e.currentTarget.querySelector('[data-dashed-line]');
              if (!line) return;
              line.style.width = '100%';
              line.style.backgroundPosition = '18px 0';
            }}
            onMouseLeave={e => {
              if (!animate) return;
              const line = e.currentTarget.querySelector('[data-dashed-line]');
              if (!line) return;
              line.style.width = '0%';
              line.style.backgroundPosition = '0 0';
            }}
          >
            <span style={{ position: 'relative', zIndex: 1 }}>{children}</span>
            <span
              data-dashed-line
              aria-hidden="true"
              style={{
                position: 'absolute',
                left: 0,
                bottom: 0,
                height: 3,
                width: animate ? '0%' : '100%',
                borderRadius: 999,
                backgroundImage: `repeating-linear-gradient(90deg, ${c.highlight} 0 9px, transparent 9px 13px)`,
                backgroundPosition: '0 0',
                transition: 'width 0.35s cubic-bezier(0.4,0,0.2,1), background-position 0.35s ease',
                zIndex: 0,
              }}
            />
          </span>
        );
      }

      if (variant === 'blur') {
        return (
          <span
            style={{ position: 'relative', display: 'inline-block', color: c.text ?? 'inherit', ...style }}
            onMouseEnter={e => {
              if (!animate) return;
              const glow = e.currentTarget.querySelector('[data-blur-bg]');
              if (!glow) return;
              glow.style.opacity = '0.75';
              glow.style.transform = 'translateY(-50%) scaleX(1)';
            }}
            onMouseLeave={e => {
              if (!animate) return;
              const glow = e.currentTarget.querySelector('[data-blur-bg]');
              if (!glow) return;
              glow.style.opacity = '0';
              glow.style.transform = 'translateY(-50%) scaleX(0.4)';
            }}
          >
            <span
              data-blur-bg
              aria-hidden="true"
              style={{
                position: 'absolute',
                left: -1,
                right: -1,
                top: '58%',
                height: '0.95em',
                borderRadius: 999,
                background: c.highlight,
                filter: 'blur(6px)',
                opacity: animate ? 0 : 0.65,
                transform: `translateY(-50%) scaleX(${animate ? 0.4 : 1})`,
                transformOrigin: '50% 50%',
                transition: 'transform 0.4s cubic-bezier(0.4,0,0.2,1), opacity 0.3s ease',
                zIndex: 0,
                pointerEvents: 'none',
              }}
            />
            <span style={{ position: 'relative', zIndex: 1 }}>{children}</span>
          </span>
        );
      }

      return <span>{children}</span>;
    }

    /* ─────────────────── Swatch colors ─────────────────── */
    const SWATCH_COLORS = {
      yellow:     '#fde68a', cyan:       '#a5f3fc', green:  '#bbf7d0',
      pink:       '#fbcfe8', orange:     '#fed7aa', purple: '#ddd6fe',
      blue:       '#bfdbfe', red:        '#fecaca',
      neonCyan:   '#06b6d4', neonPurple: '#a855f7', neonGreen: '#22c55e',
    };

    const VARIANTS = ['marker', 'brush', 'brushstroke', 'gradient', 'slide', 'glow', 'scratch', 'double', 'wave', 'pill', 'dashed', 'blur'];

    /* ─────────────────── App ─────────────────── */
    function App() {
      const [pgVariant, setPgVariant] = useState('marker');
      const [pgColor,   setPgColor]   = useState('yellow');

      const variantDescriptions = {
        marker:     'Surligneur qui s\'anime au hover',
        brush:      'Surlignage façon pinceau derrière le texte',
        brushstroke: 'Trait de pinceau SVG sous le texte',
        gradient:   'Soulignement dégradé au hover',
        slide:      'Fond qui glisse derrière le texte',
        glow:       'Lueur lumineuse sur le texte',
        scratch:    'Soulignement manuscrit double trait',
